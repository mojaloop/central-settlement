                echo "RELEASE_TAG=${RELEASE_TAG_SNAPSHOT}"
                echo "Override package version: ${CIRCLE_TAG:1}"
                npx standard-version --skip.tag --skip.commit --skip.changelog --release-as ${CIRCLE_TAG:1}
                PACKAGE_VERSION=$(cat package.json | jq -r .version)
                echo "export PACKAGE_VERSION=${PACKAGE_VERSION}" >> $BASH_ENV
                echo "PACKAGE_VERSION=${PACKAGE_VERSION}"
              name: Setup for SNAPSHOT release
          - run:
              command: |
                echo "export SLACK_PROJECT_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV
                echo "export SLACK_RELEASE_TYPE='NPM Snapshot'" >> $BASH_ENV
                echo "export SLACK_RELEASE_TAG=v${CIRCLE_TAG:1}" >> $BASH_ENV
                echo "export SLACK_RELEASE_URL=https://www.npmjs.com/package/@mojaloop/${CIRCLE_PROJECT_REPONAME}/v/${CIRCLE_TAG:1}" >> $BASH_ENV
                echo "export SLACK_BUILD_ID=${CIRCLE_BUILD_NUM}" >> $BASH_ENV
                echo "export SLACK_CI_URL=${CIRCLE_BUILD_URL}" >> $BASH_ENV
              name: Setup Slack config
          - npm_auth
          - npm_publish
          - when:
              condition: << parameters.slack >>
              steps:
                - slack_pass_fail
      release:
        description: |
          This job publishes a release to GitHub.
        environment:
          MAIN_BRANCH_NAME: main
        executor:
          name: docker
          resource_class: << parameters.resource_class >>
        parameters:
          resource_class:
            default: medium
            enum:
              - small
              - medium
              - medium+
              - large
              - xlarge
              - 2xlarge
              - 2xlarge+
            type: enum
          slack:
            default: ""
            type: string
          yarn_lock:
            default: ""
            type: string
        steps:
          - docker_dependencies
          - checkout
          - configure_nvm
          - restore_cache_command:
              yarn_lock: << parameters.yarn_lock >>
          - configure_git
          - run:
              command: |
                echo "export SLACK_PROJECT_NAME=${CIRCLE_PROJECT_REPONAME}" >> $BASH_ENV
                echo "export SLACK_RELEASE_TYPE='GitHub Release'" >> $BASH_ENV
                echo "export SLACK_RELEASE_TAG='${RELEASE_TAG} on ${CIRCLE_BRANCH} branch'" >> $BASH_ENV
                echo "export SLACK_BUILD_ID=${CIRCLE_BUILD_NUM}" >> $BASH_ENV
                echo "export SLACK_CI_URL=${CIRCLE_BUILD_URL}" >> $BASH_ENV
              name: Setup Slack config
          - run:
              command: npm run release -- --no-verify
              name: Generate changelog and bump package version
          - run:
              command: git push --follow-tags origin ${CIRCLE_BRANCH}
              name: Push the release
          - when:
              condition: << parameters.slack >>
              steps:
                - slack/notify:
                    event: fail
                    template: SLACK_TEMP_RELEASE_FAILURE
      setup:
        description: |
          Setup node.js and install dependencies.
        environment:
          MAIN_BRANCH_NAME: main
        executor:
          name: docker
          resource_class: << parameters.resource_class >>
        parameters:
          git_tag:
            default: ""
            type: string
          resource_class:
            default: medium
            enum:
              - small
              - medium
              - medium+
              - large
              - xlarge
              - 2xlarge
              - 2xlarge+
            type: enum
          yarn_lock:
            default: ""
            type: string
        steps:
          - docker_dependencies
          - when:
              condition:
                matches:
                  pattern: ^v\d+(\.\d+){2}-(minor|major|patch)\.\d+$
                  value: << parameters.git_tag >>
              steps:
                - ghpr/build-prospective-branch
          - when:
              condition:
                not:
                  matches:
                    pattern: ^v\d+(\.\d+){2}-(minor|major|patch)\.\d+$
                    value: << parameters.git_tag >>
              steps:
                - checkout
          - configure_nvm
          - display_versions
          - when:
              condition:
                not: << parameters.yarn_lock >>
              steps:
                - run:
                    command: npm ci
                    name: NPM install
                - save_cache:
                    key: dependency-cache-{{ .Environment.CIRCLE_SHA1 }}
                    paths:
                      - node_modules
          - when:
              condition: << parameters.yarn_lock >>
              steps:
                - run:
                    command: |
                      yarn install --immutable
                      yarn run build
                    name: Yarn install
                - save_cache:
                    key: yarn-packages-{{ checksum "yarn.lock" }}
                    name: Save Yarn Package Cache
                    paths:
                      - .yarn
                      - .yarn/unplugged
                      - node_modules
      test_coverage:
        description: Run code coverage check
        environment:
          MAIN_BRANCH_NAME: main
        executor:
          name: docker
          resource_class: << parameters.resource_class >>
        parameters:
          aws:
            default: ""
            type: string
          resource_class:
            default: medium
            enum:
              - small
              - medium
              - medium+
              - large
              - xlarge
              - 2xlarge
              - 2xlarge+
            type: enum
          yarn_lock:
            default: ""
            type: string
        steps:
          - docker_dependencies
          - when:
              condition: << parameters.aws >>
              steps:
                - aws_dependencies
          - checkout
          - configure_nvm
          - display_versions
          - restore_cache_command:
              yarn_lock: << parameters.yarn_lock >>
          - run:
              command: npm -s run test:coverage-check
              name: Execute code coverage check
          - store_artifacts:
              destination: test
              path: coverage
          - store_test_results:
              path: coverage
      test_dependencies:
        description: |
          This job tests the project's dependencies.
        environment:
          MAIN_BRANCH_NAME: main
        executor:
          name: docker
          resource_class: << parameters.resource_class >>
        parameters:
          resource_class:
            default: medium
            enum:
              - small
              - medium
              - medium+
              - large
              - xlarge
              - 2xlarge
              - 2xlarge+
            type: enum
          yarn_lock:
            default: ""
            type: string
        steps:
          - docker_dependencies
          - checkout
          - configure_nvm
          - display_versions
          - restore_cache_command:
              yarn_lock: << parameters.yarn_lock >>
          - run:
              command: npm run dep:check
              name: Execute dependency tests
      test_deprecations:
        description: |
          This job tests for deprecated dependencies, at any level
        environment:
          MAIN_BRANCH_NAME: main
        executor:
          name: docker
          resource_class: << parameters.resource_class >>
        parameters:
          resource_class:
            default: medium
            enum:
              - small
              - medium
              - medium+
              - large
              - xlarge
              - 2xlarge
              - 2xlarge+
            type: enum
          yarn_lock:
            default: ""
            type: string
        steps:
          - docker_dependencies
          - checkout
          - configure_nvm
          - display_versions
          - restore_cache_command:
              yarn_lock: << parameters.yarn_lock >>
          - run:
              command: |
                if [ -f yarn.lock ]; then
                  npx -y --package @mojaloop/ml-depcheck-utility@1.1.3 check-deprecations-yarn
                else
                  npx -y --package @mojaloop/ml-depcheck-utility@1.1.3 check-deprecations-npm
                fi
              name: Execute deprecations tests
